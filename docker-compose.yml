version: '3.8'
services:
    laravel.test:
        build:
            context: ./vendor/laravel/sail/runtimes/8.2
            dockerfile: Dockerfile
            args:
                WWWGROUP: '${WWWGROUP:-1000}'
        image: sail-8.2/app
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        ports:
            - '8005:80'
            - '5173:5173'
        environment:
            WWWUSER: '${WWWUSER:-1000}'
            LARAVEL_SAIL: 1
            XDEBUG_MODE: '${SAIL_XDEBUG_MODE:-off}'
            XDEBUG_CONFIG: '${SAIL_XDEBUG_CONFIG:-client_host=host.docker.internal}'
            IGNITION_LOCAL_SITES_PATH: '${APP_PATH:-.}'
            DB_HOST: mailpurse_build_153_effe2dc-db-1
            DB_PORT: 3306
        volumes:
            - '.:/var/www/html'
        networks:
            - default
            - mailpurse_network

networks:
    default:
        driver: bridge
    mailpurse_network:
        external: true
        name: mailpurse_build_153_effe2dc_default
