name: Deploy WhatsMine to Production

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, dom, fileinfo, mysql, pdo_mysql, gd, bcmath, zip
          coverage: none

      - name: Install Composer Dependencies
        run: |
          composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install NPM Dependencies & Build Assets
        run: |
          npm ci || npm install
          npm run build

      - name: Execute Deployment Commands on Hostinger via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            echo "=========================================="
            echo "SSH User Home Directory: $HOME"
            echo "Current Path: $(pwd)"
            echo "Directory listing of Home:"
            ls -la $HOME
            echo "=========================================="

            # Auto-detect target directory or deployment paths
            CUSTOM_TARGET="${{ secrets.HOSTINGER_TARGET_DIR }}"
            
            if [ -n "$CUSTOM_TARGET" ]; then
              TARGET_PATHS=("$HOME/$CUSTOM_TARGET" "$CUSTOM_TARGET")
            else
              TARGET_PATHS=(
                "$HOME/public_html/whatsmine"
                "$HOME/domains/techworldproduct.com/public_html/whatsmine"
              )
            fi

            for TARGET_DIR in "${TARGET_PATHS[@]}"; do
              echo ">>> Deploying to: $TARGET_DIR"
              mkdir -p "$TARGET_DIR" || true
              if cd "$TARGET_DIR" 2>/dev/null; then
                echo "Successfully entered: $(pwd)"
                if [ ! -d ".git" ]; then
                  echo "Cloning repository into $(pwd)..."
                  git clone https://github.com/dudhat016/whatsmine.git .
                else
                  echo "Updating repository in $(pwd)..."
                  git fetch origin main
                  git reset --hard origin/main
                fi
                if [ ! -f ".env" ]; then
                  echo "Creating .env in $(pwd)..."
                  cp .env.example .env
                  php artisan key:generate --force
                fi
                composer install --no-dev --optimize-autoloader --no-interaction
                php artisan migrate --force || true
                php artisan config:cache || true
                php artisan route:cache || true
                php artisan view:cache || true
                php artisan storage:link || true
                echo "Successfully deployed to $(pwd)"
              else
                echo "Could not enter directory: $TARGET_DIR"
              fi
            done
