name: Deploy WhatsMine to Production

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Execute Deployment Commands on Hostinger via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT || 65002 }}
          script: |
            TARGET_DIR="${{ secrets.HOSTINGER_TARGET_DIR }}"
            if [ -z "$TARGET_DIR" ]; then
              TARGET_DIR="public_html/whatsmine"
            fi
            echo "Target Deployment Folder: $TARGET_DIR"
            mkdir -p "$TARGET_DIR"
            cd "$TARGET_DIR"
            echo "Current Directory: $(pwd)"
            
            REPO_URL="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
            
            if [ ! -d ".git" ]; then
              echo "Initializing Git repository in $(pwd)..."
              git init
              git remote add origin $REPO_URL 2>/dev/null || git remote set-url origin $REPO_URL
              git fetch origin main
              git reset --hard origin/main
            else
              echo "Pulling latest changes in $(pwd)..."
              git remote set-url origin $REPO_URL 2>/dev/null || git remote set-url origin $REPO_URL
              git fetch origin main
              git reset --hard origin/main
            fi

            if [ ! -f ".env" ]; then
              echo "Setting up .env..."
              cp .env.example .env
              php artisan key:generate --force
            fi

            echo "Installing composer dependencies..."
            composer install --no-dev --optimize-autoloader --no-interaction

            echo "Running Laravel database migrations & cache refresh..."
            php artisan migrate --force || true
            php artisan config:cache || true
            php artisan route:cache || true
            php artisan view:cache || true
            php artisan storage:link || true

            echo "Deployment completed successfully at $(pwd)"
