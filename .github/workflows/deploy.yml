name: Deploy WhatsMine to Production

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, dom, fileinfo, mysql, pdo_mysql, gd, bcmath, zip
          coverage: none

      - name: Install Composer Dependencies
        run: |
          composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install NPM Dependencies & Build Assets
        run: |
          npm ci || npm install
          npm run build

      - name: Execute Deployment Commands on Hostinger via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            TARGET_DIR="${{ secrets.HOSTINGER_TARGET_DIR }}"
            if [ -z "$TARGET_DIR" ]; then
              if [ -d "public_html" ]; then
                TARGET_DIR="public_html/whatsmine"
              else
                TARGET_DIR="domains/techworldproduct.com/public_html/whatsmine"
              fi
            fi
            echo "Deploying to target directory: $TARGET_DIR"
            mkdir -p "$TARGET_DIR"
            cd "$TARGET_DIR"
            echo "Current deployment directory path: $(pwd)"
            if [ ! -d ".git" ]; then
              echo "Git repository not found in $(pwd). Cloning repository..."
              git clone https://github.com/dudhat016/whatsmine.git .
            else
              echo "Fetching latest changes..."
              git fetch origin main
              git reset --hard origin/main
            fi
            if [ ! -f ".env" ]; then
              echo "Creating .env file..."
              cp .env.example .env
              php artisan key:generate --force
            fi
            composer install --no-dev --optimize-autoloader --no-interaction
            php artisan migrate --force
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            php artisan storage:link || true
            echo "Deployment finished successfully at $(pwd)"
