name: Deploy WhatsMine to Production

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, dom, fileinfo, mysql, pdo_mysql, gd, bcmath, zip
          coverage: none

      - name: Install Composer Dependencies
        run: |
          composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install NPM Dependencies & Build Assets
        run: |
          npm ci || npm install
          npm run build

      - name: Upload Project Files to Hostinger via SCP
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT }}
          source: ".,!node_modules,.env.example"
          target: ${{ secrets.HOSTINGER_TARGET_DIR || 'public_html/whatsmine' }}

      - name: Execute Post-Deployment Commands on Hostinger
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            TARGET_DIR="${{ secrets.HOSTINGER_TARGET_DIR }}"
            if [ -z "$TARGET_DIR" ]; then
              TARGET_DIR="public_html/whatsmine"
            fi
            cd "$TARGET_DIR"
            echo "Current Path: $(pwd)"
            if [ ! -f ".env" ]; then
              echo "Creating .env in $(pwd)..."
              cp .env.example .env
              php artisan key:generate --force
            fi
            php artisan migrate --force || true
            php artisan config:cache || true
            php artisan route:cache || true
            php artisan view:cache || true
            php artisan storage:link || true
            echo "Deployment to $(pwd) completed successfully!"
